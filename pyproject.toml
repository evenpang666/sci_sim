[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sci-sim"
version = "0.1.0"
description = "Dual-arm laboratory manipulation benchmark for ManiSkill"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "PyYAML>=6", "requests>=2.32"]

[project.optional-dependencies]
sim = ["mani_skill==3.0.1", "sapien==3.0.3", "xacro==2.1.1", "trimesh>=4.4", "pycollada>=0.8"]
planning = ["mplib==0.2.1"]
data = ["lerobot[dataset]==0.7.0; python_version >= '3.12'"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
sci-sim = "sci_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_sim"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/constraints", "README.md", "pyproject.toml", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires prepared assets, simulation dependencies, and working Vulkan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
override-dependencies = ["mplib==0.2.1; sys_platform == 'linux'"]

